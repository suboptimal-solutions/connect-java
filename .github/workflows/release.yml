name: Release to Maven Central

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Verify tag matches project version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]; then
            echo "Expected a tag such as v0.1.0 or v0.1.0-rc1" >&2
            exit 1
          fi
          pom_version="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ns = '{http://maven.apache.org/POM/4.0.0}'
          root = ET.parse('pom.xml').getroot()
          version = root.findtext(f'{ns}version')
          for module in root.findall(f'{ns}modules/{ns}module'):
            module_name = module.text
            child = ET.parse(Path(module_name) / 'pom.xml').getroot()
            parent_version = child.findtext(f'{ns}parent/{ns}version')
            if parent_version != version:
              raise SystemExit(f'{module_name} parent version {parent_version} differs from {version}')
          print(version)
          PY
          )"
          if [[ "$pom_version" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match POM version $pom_version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag $GITHUB_REF_NAME must point to a commit on main" >&2
            exit 1
          fi

      - name: Build and test
        run: ./mvnw -B verify

      - name: Verify release artifacts
        run: |
          ./mvnw -B -P release -Dgpg.skip=true -DskipTests -pl '!connect-java-conformance' package
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ns = '{http://maven.apache.org/POM/4.0.0}'
          root = ET.parse('pom.xml').getroot()
          version = root.findtext(f'{ns}version')
          for module in root.findall(f'{ns}modules/{ns}module'):
            module_name = module.text
            if module_name == 'connect-java-conformance':
              continue
            child = ET.parse(Path(module_name) / 'pom.xml').getroot()
            if child.findtext(f'{ns}packaging', 'jar') == 'pom':
              continue
            artifact_id = child.findtext(f'{ns}artifactId')
            for classifier in ('sources', 'javadoc'):
              archive = Path(module_name) / 'target' / f'{artifact_id}-{version}-{classifier}.jar'
              if not archive.is_file() or archive.stat().st_size == 0:
                raise SystemExit(f'Missing release artifact: {archive}')
          PY

  publish:
    needs: verify
    if: github.repository == 'suboptimal-solutions/connect-java'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check publication credentials
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for name in CENTRAL_USERNAME CENTRAL_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: GPG_PASSPHRASE

      - name: Publish and wait for Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -P release -DskipTests -pl '!connect-java-conformance' deploy
